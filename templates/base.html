<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Aachi - Tamil Recipe Recommender{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: 45 93% 47%;
            --accent: 142 76% 36%;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50">
    <nav class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="text-2xl font-bold bg-gradient-to-r from-yellow-500 to-green-600 bg-clip-text text-transparent">
                    AI Aachi
                </a>
                <div class="flex gap-4">
                    <a href="/" class="text-gray-700 hover:text-yellow-600">Home</a>
                    <a href="/ai-cook" class="text-gray-700 hover:text-yellow-600">AI Cook</a>
                    <a href="/all-recipes" class="text-gray-700 hover:text-yellow-600">All Recipes</a>
                </div>
            </div>
        </div>
    </nav>
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <footer class="py-12 border-t mt-16 bg-gradient-to-b from-white to-gray-100">
        <div class="container mx-auto px-4 text-center">
            <p class="text-2xl font-bold bg-gradient-to-r from-yellow-500 to-green-600 bg-clip-text text-transparent">
                Tamil Smart Samayal
            </p>
            <p class="text-lg text-gray-600 mt-2">Made with ❤️ and masala in Tamil Nadu</p>
            <p class="text-sm text-gray-500 mt-2">© 2025 Tamil Smart Samayal | AI-powered recipe recommendations</p>
        </div>
    </footer>
    
    {% block scripts %}{% endblock %}
</body>
</html>
