{% extends "base.html" %}

{% block title %}AI Cook - AI Aachi{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-4xl font-bold mb-8 text-center">AI Cook Assistant</h1>
    
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-lg p-6">
        <div id="chat-container" class="h-96 overflow-y-auto border rounded p-4 mb-4 bg-gray-50">
            <div class="text-center text-gray-500">Start a conversation with AI Aachi...</div>
        </div>
        
        <div class="flex gap-2">
            <input type="text" id="message-input" 
                   class="flex-1 border rounded px-4 py-2" 
                   placeholder="Ask about Tamil recipes or ingredients...">
            <button onclick="sendMessage()" 
                    class="bg-yellow-500 text-white px-6 py-2 rounded hover:bg-yellow-600">
                Send
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let messages = [];

async function sendMessage() {
    const input = document.getElementById('message-input');
    const message = input.value.trim();
    if (!message) return;
    
    const chatContainer = document.getElementById('chat-container');
    chatContainer.innerHTML = '';
    
    // Add user message
    messages.push({ role: 'user', content: message });
    addMessageToChat('user', message);
    input.value = '';
    
    // Add assistant placeholder
    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'mb-4';
    assistantDiv.id = 'assistant-message';
    chatContainer.appendChild(assistantDiv);
    
    // Stream response
    try {
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ messages })
        });
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const chunk = decoder.decode(value);
            const lines = chunk.split('\\n');
            
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = line.slice(6);
                    if (data === '[DONE]' || !data.trim()) continue;
                    
                    try {
                        const parsed = JSON.parse(data);
                        if (parsed.done) break;
                        if (parsed.error) {
                            assistantDiv.innerHTML = `<p class="text-red-500">Error: ${parsed.error}</p>`;
                            break;
                        }
                        
                        const content = parsed.text || parsed.choices?.[0]?.delta?.content;
                        if (content) {
                            fullContent += content;
                            assistantDiv.innerHTML = `<div class="bg-blue-50 p-3 rounded"><p class="whitespace-pre-wrap">${fullContent}</p></div>`;
                        }
                    } catch (e) {
                        // Ignore parsing errors
                    }
                }
            }
        }
        
        messages.push({ role: 'assistant', content: fullContent });
    } catch (error) {
        assistantDiv.innerHTML = `<p class="text-red-500">Error: ${error.message}</p>`;
    }
}

function addMessageToChat(role, content) {
    const chatContainer = document.getElementById('chat-container');
    const div = document.createElement('div');
    div.className = `mb-4 ${role === 'user' ? 'text-right' : ''}`;
    div.innerHTML = `<div class="inline-block p-3 rounded ${role === 'user' ? 'bg-yellow-100' : 'bg-blue-50'}"><p>${content}</p></div>`;
    chatContainer.appendChild(div);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

document.getElementById('message-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendMessage();
});
</script>
{% endblock %}
